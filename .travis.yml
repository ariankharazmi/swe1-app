dist: jammy
language: python
python:
  - "3.12"

install:
  - pip install -r requirements.txt
  - pip install black flake8 coverage coveralls

script:
  - black --check .
  - flake8 .
  - coverage run --source=polls,mysite manage.py test

after_success:
  - coveralls

deploy:
  provider: elasticbeanstalk
  edge: true
  access_key_id: $AWS_ACCESS_KEY
  secret_access_key: $AWS_SECRET_KEY
  region: "us-east-2"
  app: "swe1-app"
  env: "swe1-app-env"
  bucket: "elasticbeanstalk-us-east-2-261247365523"
  on:
    branch: main
